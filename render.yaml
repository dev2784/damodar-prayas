services:
  - type: web
    name: damodar-prayas-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm prisma migrate deploy --schema=prisma/schema.prisma && pnpm build:api
    startCommand: pnpm --filter @damodar/api start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: http://localhost:3000,http://localhost:8081
      - key: OTP_PROVIDER
        value: disabled
      - key: MEDIA_PROVIDER
        value: disabled
