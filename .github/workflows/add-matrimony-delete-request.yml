name: Apply matrimony edit and delete request flow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-matrimony-delete-request.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply patch
        run: python scripts/patch_matrimony_delete_request.py
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma generate --schema=prisma/schema.prisma
          pnpm --filter @damodar/api build
          pnpm --filter mobile exec tsc --noEmit
      - name: Commit
        run: |
          rm .github/workflows/add-matrimony-delete-request.yml scripts/patch_matrimony_delete_request.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(matrimony): add approved edits and deletion requests"
          git push origin main
