name: Fix accepted contact display

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-contact-profile-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch accepted contact display
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/src/app/matrimony-profile.tsx')
          s = p.read_text()
          s = s.replace(
            "  const { data: contactData, isFetching: contactLoading } = useGetProfileContactQuery(",
            "  const { data: contactData, isFetching: contactLoading, isError: contactError } = useGetProfileContactQuery("
          )
          old = '''          {contactLoading ? <ActivityIndicator color={C.green} size="small" /> : (
            <View style={styles.contactDetails}>
              {contactData?.contactPhone ? <Text style={styles.contactValue}>📞 {contactData.contactPhone}</Text> : null}
              {contactData?.contactEmail ? <Text style={styles.contactValue}>✉️ {contactData.contactEmail}</Text> : null}
              {!contactData?.contactPhone && !contactData?.contactEmail ? <Text style={styles.contactEmpty}>इस प्रोफाइल ने अभी संपर्क जानकारी नहीं जोड़ी है।</Text> : null}
            </View>
          )}'''
          new = '''          {contactLoading ? <ActivityIndicator color={C.green} size="small" /> : contactError ? (
            <Text style={styles.contactEmpty}>संपर्क विवरण लोड नहीं हो पाया। कृपया प्रोफाइल दोबारा खोलें।</Text>
          ) : (
            <View style={styles.contactDetails}>
              {contactData?.contactPhone ? <Text style={styles.contactValue}>📞 {contactData.contactPhone}</Text> : null}
              {contactData?.contactEmail ? <Text style={styles.contactValue}>✉️ {contactData.contactEmail}</Text> : null}
              {!contactData?.contactPhone && !contactData?.contactEmail ? <Text style={styles.contactEmpty}>इस प्रोफाइल ने अभी संपर्क जानकारी नहीं जोड़ी है।</Text> : null}
            </View>
          )}'''
          if old not in s:
              raise SystemExit('contact block marker not found')
          s = s.replace(old, new)
          old_privacy = '''      <View style={styles.privacyNote}>
        <SymbolView name={{ ios: 'lock.shield.fill', android: 'privacy_tip', web: 'privacy_tip' }} tintColor={C.green} size={20} />
        <Text style={styles.privacyText}>संपर्क जानकारी निजी रहती है। आगे contact request flow के बाद ही दिखाई जाएगी।</Text>
      </View>'''
          new_privacy = '''      {!acceptedInterest ? (
        <View style={styles.privacyNote}>
          <SymbolView name={{ ios: 'lock.shield.fill', android: 'privacy_tip', web: 'privacy_tip' }} tintColor={C.green} size={20} />
          <Text style={styles.privacyText}>संपर्क जानकारी निजी रहती है। रुचि स्वीकार होने के बाद ही दिखाई जाएगी।</Text>
        </View>
      ) : null}'''
          if old_privacy not in s:
              raise SystemExit('privacy note marker not found')
          s = s.replace(old_privacy, new_privacy)
          p.write_text(s)
          PY
      - name: Verify mobile types
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter mobile exec tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-contact-profile-display.yml
          git add apps/mobile/src/app/matrimony-profile.tsx
          git commit -m "fix(matrimony): hide stale privacy note after acceptance"
          git push origin main
