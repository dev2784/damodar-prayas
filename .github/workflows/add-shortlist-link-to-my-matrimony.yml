name: Add shortlist link to My Matrimony

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-shortlist-link-to-my-matrimony.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Add compact shortlist link
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/mobile/src/app/my-matrimony.tsx')
          s = p.read_text()

          marker = "      <View style={styles.infoBanner}><SymbolView name={{ ios: 'shield.checkered', android: 'verified_user', web: 'verified_user' }} tintColor={C.green} size={22} /><View style={styles.infoCopy}><Text style={styles.infoTitle}>आप नियंत्रण में हैं</Text><Text style={styles.infoText}>ड्राफ्ट सीधे हट सकता है। Submitted/approved प्रोफाइल हटाने के लिए admin request जाएगी।</Text></View></View>\n"
          addition = marker + "      <Pressable style={styles.shortlistLink} onPress={() => router.push('/matrimony-shortlist')}><View style={styles.shortlistIcon}><SymbolView name={{ ios: 'bookmark.fill', android: 'bookmark', web: 'bookmark' }} tintColor={C.maroon} size={18} /></View><View style={styles.shortlistCopy}><Text style={styles.shortlistTitle}>मेरी Shortlist</Text><Text style={styles.shortlistText}>आपके सेव किए हुए मैट्रिमोनी प्रोफाइल</Text></View><SymbolView name={{ ios: 'chevron.right', android: 'chevron_right', web: 'chevron_right' }} tintColor={C.muted} size={17} /></Pressable>\n"
          if 'styles.shortlistLink' not in s:
              if marker not in s:
                  raise SystemExit('info banner marker not found')
              s = s.replace(marker, addition, 1)

          style_marker = "  infoBanner: { flexDirection: 'row', gap: 10, padding: 13, borderRadius: 15, backgroundColor: '#F2FBF6', borderWidth: 1, borderColor: '#CFEBDD', marginBottom: 15 }, infoCopy: { flex: 1 }, infoTitle: { color: '#135C43', fontSize: 12, fontWeight: '900' }, infoText: { color: '#497063', fontSize: 10.5, lineHeight: 16, marginTop: 2 },"
          style_addition = style_marker + " shortlistLink: { minHeight: 58, flexDirection: 'row', alignItems: 'center', gap: 10, paddingHorizontal: 12, paddingVertical: 9, marginBottom: 15, borderRadius: 14, backgroundColor: '#FFFDF9', borderWidth: 1, borderColor: C.line }, shortlistIcon: { width: 36, height: 36, borderRadius: 11, alignItems: 'center', justifyContent: 'center', backgroundColor: '#FFF1EE' }, shortlistCopy: { flex: 1 }, shortlistTitle: { color: C.maroonDark, fontSize: 12, fontWeight: '900' }, shortlistText: { color: C.muted, fontSize: 9.5, marginTop: 2 },"
          if 'shortlistLink:' not in s:
              if style_marker not in s:
                  raise SystemExit('style marker not found')
              s = s.replace(style_marker, style_addition, 1)

          p.write_text(s)
          PY

      - name: Verify mobile types
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter mobile exec tsc --noEmit

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-shortlist-link-to-my-matrimony.yml
          git add apps/mobile/src/app/my-matrimony.tsx
          git commit -m "fix(matrimony): restore shortlist link on profile page"
          git push origin main
