name: Exclude own matrimony profiles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/exclude-own-matrimony-profiles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch matrimony list
        run: |
          python -c "from pathlib import Path; p=Path('apps/api/src/modules/matrimony/routes.ts'); s=p.read_text(); marker='function yearsAgo(years: number) {'; helper='async function getOptionalActiveUserId(request: FastifyRequest) {\\n  const authorization = request.headers.authorization;\\n  if (!authorization?.startsWith(\\'Bearer \\')) return null;\\n\\n  try {\\n    const payload = await request.jwtVerify<{ sub: string }>();\\n    const user = await prisma.user.findFirst({\\n      where: { id: payload.sub, isActive: true, deletedAt: null },\\n      select: { id: true },\\n    });\\n    return user?.id ?? null;\\n  } catch {\\n    return null;\\n  }\\n}\\n\\n'; s=s if helper in s else s.replace(marker, helper+marker, 1); old='  app.get(\\'/\\', async (request, reply) => {\\n    const parsed = matrimonyListQuerySchema.safeParse(request.query);'; new='  app.get(\\'/\\', async (request, reply) => {\\n    const activeUserId = await getOptionalActiveUserId(request);\\n    const parsed = matrimonyListQuerySchema.safeParse(request.query);'; s=s if new in s else s.replace(old,new,1); oldw='    const where: Prisma.MatrimonyProfileWhereInput = {\\n      status: \\'APPROVED\\',\\n      deletedAt: null,'; neww='    const where: Prisma.MatrimonyProfileWhereInput = {\\n      status: \\'APPROVED\\',\\n      deletedAt: null,\\n      ...(activeUserId ? { createdById: { not: activeUserId } } : {}),'; s=s if neww in s else s.replace(oldw,neww,1); p.write_text(s)"

      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @damodar/api build

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/exclude-own-matrimony-profiles.yml
          git add apps/api/src/modules/matrimony/routes.ts
          git commit -m "fix(matrimony): hide own profiles from public list"
          git push origin main
