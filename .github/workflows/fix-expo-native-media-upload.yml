name: Fix Expo native media upload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-expo-native-media-upload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Expo FileSystem and patch uploader
        run: |
          pnpm --filter mobile add expo-file-system@~57.0.7
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/src/services/matrimony-media-api.ts')
          text = p.read_text()
          if "import { File, UploadType } from 'expo-file-system';" not in text:
              text = text.replace(
                  "import { API_BASE_URL, api } from '@/services/api';",
                  "import { File, UploadType } from 'expo-file-system';\n\nimport { API_BASE_URL, api } from '@/services/api';",
                  1,
              )

          old = '''  const formData = new FormData();
  formData.append('file', {
    uri: file.uri,
    name: file.name,
    type: file.type,
  } as unknown as Blob);

  const suffix = kind === 'photo' ? 'photos' : 'kundali';
  let response: Response;
  try {
    response = await fetch(`${API_BASE_URL}/media/matrimony/${profileId}/${suffix}`, {
      method: 'POST',
      headers: {
        authorization: `Bearer ${accessToken}`,
        accept: 'application/json',
      },
      body: formData,
    });
  } catch (error) {
    throw { status: 'FETCH_ERROR', data: { error: 'UPLOAD_NETWORK_ERROR', message: String(error) } };
  }

  const raw = await response.text();
  let data: unknown = {};
  if (raw) {
    try {
      data = JSON.parse(raw);
    } catch {
      data = { message: raw };
    }
  }

  if (!response.ok) {
    throw { status: response.status, data };
  }

  return data;'''

          new = '''  const suffix = kind === 'photo' ? 'photos' : 'kundali';
  const selectedFile = new File(file.uri);
  let result: Awaited<ReturnType<File['upload']>>;

  try {
    result = await selectedFile.upload(`${API_BASE_URL}/media/matrimony/${profileId}/${suffix}`, {
      httpMethod: 'POST',
      uploadType: UploadType.MULTIPART,
      fieldName: 'file',
      mimeType: file.type,
      headers: {
        authorization: `Bearer ${accessToken}`,
        accept: 'application/json',
      },
    });
  } catch (error) {
    throw {
      status: 'FETCH_ERROR',
      data: {
        error: 'UPLOAD_NETWORK_ERROR',
        message: error instanceof Error ? error.message : String(error),
      },
    };
  }

  const raw = result.body ?? '';
  let data: unknown = {};
  if (raw) {
    try {
      data = JSON.parse(raw);
    } catch {
      data = { message: raw };
    }
  }

  if (result.status < 200 || result.status >= 300) {
    throw { status: result.status, data };
  }

  return data;'''

          if old not in text:
              raise SystemExit('Existing direct fetch uploader block not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Verify builds
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @damodar/api build
          pnpm --filter mobile exec tsc --noEmit

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-expo-native-media-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json pnpm-lock.yaml apps/mobile/src/services/matrimony-media-api.ts .github/workflows/fix-expo-native-media-upload.yml
          git commit -m "fix(mobile): use Expo native multipart media upload"
          git push origin main
