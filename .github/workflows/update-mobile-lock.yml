name: Update mobile lockfile
on:
  push:
    branches: [main]
    paths: [.github/workflows/update-mobile-lock.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter mobile exec tsc --noEmit
      - run: |
          rm .github/workflows/update-mobile-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml .github/workflows/update-mobile-lock.yml
          git commit -m "chore(mobile): lock Expo file system dependency"
          git push origin main
