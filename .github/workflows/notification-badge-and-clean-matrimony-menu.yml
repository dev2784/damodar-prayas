name: Matrimony request notifications UX

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-matrimony-notification-ux.py
      - .github/workflows/notification-badge-and-clean-matrimony-menu.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch notification UX
        run: python scripts/patch-matrimony-notification-ux.py
      - name: Verify mobile types
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter mobile exec tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/notification-badge-and-clean-matrimony-menu.yml scripts/patch-matrimony-notification-ux.py
          git add apps/mobile/src/app/index.tsx apps/mobile/src/app/my-matrimony.tsx
          git commit -m "fix(matrimony): move interest requests to home notifications"
          git push origin main
