name: Fix matrimony owner CTA flow

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-matrimony-owner-cta.mjs
      - .github/workflows/fix-matrimony-owner-cta.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch matrimony CTA routing
        run: node scripts/fix-matrimony-owner-cta.mjs
      - name: Verify mobile types
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter mobile exec tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/src/app/matrimony.tsx
          git commit -m "fix(mobile): route existing matrimony owners to profile list"
          git push origin main
