name: Filter own matrimony profiles on mobile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/filter-own-matrimony-mobile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch mobile list filter
        run: |
          python -c "from pathlib import Path; p=Path('apps/mobile/src/app/matrimony.tsx'); s=p.read_text(); old='  const hasAnyOwnProfile = (mineData?.items.length ?? 0) > 0;'; new='  const hasAnyOwnProfile = (mineData?.items.length ?? 0) > 0;\\n  const ownProfileIds = useMemo(() => new Set(mineData?.items.map((item) => item.id) ?? []), [mineData?.items]);\\n  const visibleProfiles = useMemo(() => (data?.items ?? []).filter((item) => !ownProfileIds.has(item.id)), [data?.items, ownProfileIds]);'; s=s if new in s else s.replace(old,new,1); s=s.replace('        data={data?.items ?? []}','        data={visibleProfiles}',1); p.write_text(s)"

      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter mobile exec tsc --noEmit

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/filter-own-matrimony-mobile.yml
          git add apps/mobile/src/app/matrimony.tsx
          git commit -m "fix(matrimony): filter own profiles from discovery"
          git push origin main
