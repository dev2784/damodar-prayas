name: Fix matrimony drafts and media uploads

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-matrimony-drafts-media.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch draft resume, delete and raw media upload
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # Export API base URL so raw multipart fetch can use the exact same backend.
          replace(
              'apps/mobile/src/services/api.ts',
              "const baseUrl =\n  process.env.EXPO_PUBLIC_API_URL ?? 'https://damodar-prayas-api.onrender.com/api/v1';",
              "export const API_BASE_URL =\n  process.env.EXPO_PUBLIC_API_URL ?? 'https://damodar-prayas-api.onrender.com/api/v1';",
          )
          replace(
              'apps/mobile/src/services/api.ts',
              '    baseUrl,',
              '    baseUrl: API_BASE_URL,',
          )

          # Add a direct React Native fetch uploader. This avoids RTK multipart serialization issues on Android.
          replace(
              'apps/mobile/src/services/matrimony-media-api.ts',
              "import { api } from '@/services/api';",
              "import { API_BASE_URL, api } from '@/services/api';",
          )
          replace(
              'apps/mobile/src/services/matrimony-media-api.ts',
              "function asFormData(file: UploadableFile) {\n  const formData = new FormData();\n  formData.append('file', file as unknown as Blob);\n  return formData;\n}\n",
              "function asFormData(file: UploadableFile) {\n  const formData = new FormData();\n  formData.append('file', file as unknown as Blob);\n  return formData;\n}\n\nexport async function uploadMatrimonyMediaFile({\n  profileId,\n  kind,\n  file,\n  accessToken,\n}: {\n  profileId: string;\n  kind: 'photo' | 'kundali';\n  file: UploadableFile;\n  accessToken: string;\n}) {\n  const formData = new FormData();\n  formData.append('file', {\n    uri: file.uri,\n    name: file.name,\n    type: file.type,\n  } as unknown as Blob);\n\n  const suffix = kind === 'photo' ? 'photos' : 'kundali';\n  let response: Response;\n  try {\n    response = await fetch(`${API_BASE_URL}/media/matrimony/${profileId}/${suffix}`, {\n      method: 'POST',\n      headers: {\n        authorization: `Bearer ${accessToken}`,\n        accept: 'application/json',\n      },\n      body: formData,\n    });\n  } catch (error) {\n    throw { status: 'FETCH_ERROR', data: { error: 'UPLOAD_NETWORK_ERROR', message: String(error) } };\n  }\n\n  const raw = await response.text();\n  let data: unknown = {};\n  if (raw) {\n    try {\n      data = JSON.parse(raw);\n    } catch {\n      data = { message: raw };\n    }\n  }\n\n  if (!response.ok) {\n    throw { status: response.status, data };\n  }\n\n  return data;\n}\n",
          )

          # Smart-resume an existing draft unless the user explicitly asks for a fresh profile.
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "  useDeleteMatrimonyKundaliMutation,\n  useDeleteMatrimonyPhotoMutation,\n  useSetPrimaryMatrimonyPhotoMutation,\n  useUploadMatrimonyKundaliMutation,\n  useUploadMatrimonyPhotoMutation,\n} from '@/services/matrimony-media-api';",
              "  uploadMatrimonyMediaFile,\n  useDeleteMatrimonyKundaliMutation,\n  useDeleteMatrimonyPhotoMutation,\n  useSetPrimaryMatrimonyPhotoMutation,\n} from '@/services/matrimony-media-api';",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "  const params = useLocalSearchParams<{ id?: string | string[] }>();\n  const profileId = Array.isArray(params.id) ? params.id[0] : params.id;",
              "  const params = useLocalSearchParams<{ id?: string | string[]; newProfile?: string | string[] }>();\n  const profileId = Array.isArray(params.id) ? params.id[0] : params.id;\n  const newProfileParam = Array.isArray(params.newProfile) ? params.newProfile[0] : params.newProfile;\n  const forceNewProfile = newProfileParam === '1';",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "  const { data: mineData, isLoading: isLoadingMine, refetch: refetchMine } = useGetMyMatrimonyProfilesQuery(undefined, {\n    skip: !accessToken || !profileId,\n  });",
              "  const { data: mineData, isLoading: isLoadingMine, refetch: refetchMine } = useGetMyMatrimonyProfilesQuery(undefined, {\n    skip: !accessToken,\n  });",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "  const [uploadPhoto, { isLoading: isUploadingPhoto }] = useUploadMatrimonyPhotoMutation();\n  const [deletePhoto, { isLoading: isDeletingPhoto }] = useDeleteMatrimonyPhotoMutation();\n  const [setPrimaryPhoto, { isLoading: isSettingPrimary }] = useSetPrimaryMatrimonyPhotoMutation();\n  const [uploadKundali, { isLoading: isUploadingKundali }] = useUploadMatrimonyKundaliMutation();\n  const [deleteKundali, { isLoading: isDeletingKundali }] = useDeleteMatrimonyKundaliMutation();",
              "  const [uploadingMedia, setUploadingMedia] = useState<'photo' | 'kundali' | null>(null);\n  const [deletePhoto, { isLoading: isDeletingPhoto }] = useDeleteMatrimonyPhotoMutation();\n  const [setPrimaryPhoto, { isLoading: isSettingPrimary }] = useSetPrimaryMatrimonyPhotoMutation();\n  const [deleteKundali, { isLoading: isDeletingKundali }] = useDeleteMatrimonyKundaliMutation();",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "  useEffect(() => {\n    if (editingProfile && hydratedId !== editingProfile.id) {\n      setForm(profileToForm(editingProfile));\n      setHydratedId(editingProfile.id);\n    }\n  }, [editingProfile, hydratedId]);\n\n  const busy = isCreating || isUpdating || isSubmitting;\n  const mediaBusy = isUploadingPhoto || isDeletingPhoto || isSettingPrimary || isUploadingKundali || isDeletingKundali;",
              "  useEffect(() => {\n    if (editingProfile && hydratedId !== editingProfile.id) {\n      setForm(profileToForm(editingProfile));\n      setHydratedId(editingProfile.id);\n    }\n  }, [editingProfile, hydratedId]);\n\n  useEffect(() => {\n    if (!accessToken || profileId || forceNewProfile || isLoadingMine || !mineData) return;\n    const resumable = mineData.items.find((item) => item.status === 'DRAFT' || item.status === 'REJECTED');\n    if (resumable) {\n      router.replace({ pathname: '/matrimony-form', params: { id: resumable.id } });\n    }\n  }, [accessToken, forceNewProfile, isLoadingMine, mineData, profileId]);\n\n  const busy = isCreating || isUpdating || isSubmitting;\n  const mediaBusy = uploadingMedia !== null || isDeletingPhoto || isSettingPrimary || isDeletingKundali;",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "  async function pickAndUploadPhoto() {\n    if (!profileId || editingLocked) return;",
              "  async function pickAndUploadPhoto() {\n    if (!profileId || editingLocked || !accessToken) return;",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "    try {\n      await uploadPhoto({\n        profileId,\n        file: {\n          uri: asset.uri,\n          name: asset.fileName || fileNameFromUri(asset.uri, `profile-${Date.now()}.jpg`),\n          type,\n        },\n      }).unwrap();\n      await refetchMine();\n    } catch (error) {\n      Alert.alert('फोटो अपलोड नहीं हुआ', mediaErrorMessage(error));\n    }",
              "    setUploadingMedia('photo');\n    try {\n      await uploadMatrimonyMediaFile({\n        profileId,\n        accessToken,\n        kind: 'photo',\n        file: {\n          uri: asset.uri,\n          name: asset.fileName || fileNameFromUri(asset.uri, `profile-${Date.now()}.jpg`),\n          type,\n        },\n      });\n      await refetchMine();\n      Alert.alert('फोटो जुड़ गई', 'फोटो प्रोफाइल में जोड़ दी गई है।');\n    } catch (error) {\n      Alert.alert('फोटो अपलोड नहीं हुआ', mediaErrorMessage(error));\n    } finally {\n      setUploadingMedia(null);\n    }",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "  async function pickAndUploadKundali() {\n    if (!profileId || editingLocked) return;",
              "  async function pickAndUploadKundali() {\n    if (!profileId || editingLocked || !accessToken) return;",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "    try {\n      await uploadKundali({\n        profileId,\n        file: {\n          uri: asset.uri,\n          name: asset.name || fileNameFromUri(asset.uri, `kundali-${Date.now()}.pdf`),\n          type: asset.mimeType || 'application/pdf',\n        },\n      }).unwrap();\n      await refetchMine();\n    } catch (error) {\n      Alert.alert('कुंडली अपलोड नहीं हुई', mediaErrorMessage(error));\n    }",
              "    setUploadingMedia('kundali');\n    try {\n      await uploadMatrimonyMediaFile({\n        profileId,\n        accessToken,\n        kind: 'kundali',\n        file: {\n          uri: asset.uri,\n          name: asset.name || fileNameFromUri(asset.uri, `kundali-${Date.now()}.pdf`),\n          type: asset.mimeType || 'application/pdf',\n        },\n      });\n      await refetchMine();\n      Alert.alert('कुंडली जुड़ गई', 'कुंडली प्रोफाइल में जोड़ दी गई है।');\n    } catch (error) {\n      Alert.alert('कुंडली अपलोड नहीं हुई', mediaErrorMessage(error));\n    } finally {\n      setUploadingMedia(null);\n    }",
          )
          replace(
              'apps/mobile/src/app/matrimony-form.tsx',
              "  if (code === 'UNSUPPORTED_KUNDALI_TYPE') return 'कुंडली PDF, JPG, PNG या WEBP में होनी चाहिए।';\n  return 'Upload पूरा नहीं हुआ। कृपया दोबारा कोशिश करें।';",
              "  if (code === 'UNSUPPORTED_KUNDALI_TYPE') return 'कुंडली PDF, JPG, PNG या WEBP में होनी चाहिए।';\n  if (code === 'UPLOAD_NETWORK_ERROR') return 'Upload request server तक नहीं पहुँच पाई। इंटरनेट/API connection जाँचकर दोबारा कोशिश करें।';\n  if (code) return `Upload fail हुआ: ${code}`;\n  return 'Upload पूरा नहीं हुआ। कृपया दोबारा कोशिश करें।';",
          )

          # Main matrimony CTA resumes newest editable draft instead of always creating a new one.
          replace(
              'apps/mobile/src/app/matrimony.tsx',
              "  useGetMatrimonyProfilesQuery,\n} from '@/services/matrimony-api';",
              "  useGetMatrimonyProfilesQuery,\n  useGetMyMatrimonyProfilesQuery,\n} from '@/services/matrimony-api';\nimport { useAppSelector } from '@/store/hooks';",
          )
          replace(
              'apps/mobile/src/app/matrimony.tsx',
              "export default function MatrimonyScreen() {\n  const [gender, setGender] = useState<MatrimonyGender | undefined>();",
              "export default function MatrimonyScreen() {\n  const accessToken = useAppSelector((state) => state.auth.accessToken);\n  const [gender, setGender] = useState<MatrimonyGender | undefined>();",
          )
          replace(
              'apps/mobile/src/app/matrimony.tsx',
              "  const { data, isLoading, isFetching, isError, refetch } = useGetMatrimonyProfilesQuery(queryArgs);\n\n  function changeGender(value?: MatrimonyGender) {",
              "  const { data, isLoading, isFetching, isError, refetch } = useGetMatrimonyProfilesQuery(queryArgs);\n  const { data: mineData } = useGetMyMatrimonyProfilesQuery(undefined, { skip: !accessToken });\n  const resumableProfile = mineData?.items.find((item) => item.status === 'DRAFT' || item.status === 'REJECTED');\n\n  function openOwnerFlow() {\n    if (!accessToken) {\n      router.push({ pathname: '/auth', params: { mode: 'register', next: '/matrimony-form' } });\n      return;\n    }\n    if (resumableProfile) {\n      router.push({ pathname: '/matrimony-form', params: { id: resumableProfile.id } });\n      return;\n    }\n    if ((mineData?.items.length ?? 0) > 0) {\n      router.push('/my-matrimony');\n      return;\n    }\n    router.push('/matrimony-form');\n  }\n\n  function changeGender(value?: MatrimonyGender) {",
          )
          replace(
              'apps/mobile/src/app/matrimony.tsx',
              "            <Pressable style={styles.createProfileBanner} onPress={() => router.push('/matrimony-form')}>\n              <View style={styles.createProfileIcon}>\n                <SymbolView name={{ ios: 'heart.circle.fill', android: 'favorite', web: 'favorite' }} tintColor={C.maroon} size={26} />\n              </View>\n              <View style={styles.createProfileCopy}>\n                <Text style={styles.createProfileTitle}>अपना मैट्रिमोनी प्रोफाइल बनाएँ</Text>\n                <Text style={styles.createProfileText}>अपनी जानकारी भरें, ड्राफ्ट सेव करें और तैयार होने पर समीक्षा के लिए भेजें।</Text>\n              </View>\n              <View style={styles.createProfileButton}>\n                <Text style={styles.createProfileButtonText}>बनाएँ</Text>",
              "            <Pressable style={styles.createProfileBanner} onPress={openOwnerFlow}>\n              <View style={styles.createProfileIcon}>\n                <SymbolView name={{ ios: 'heart.circle.fill', android: 'favorite', web: 'favorite' }} tintColor={C.maroon} size={26} />\n              </View>\n              <View style={styles.createProfileCopy}>\n                <Text style={styles.createProfileTitle}>{resumableProfile ? 'अपना ड्राफ्ट जारी रखें' : 'अपना मैट्रिमोनी प्रोफाइल बनाएँ'}</Text>\n                <Text style={styles.createProfileText}>{resumableProfile ? 'आपका अधूरा ड्राफ्ट मिल गया है। वहीं से आगे जारी रखें।' : 'अपनी जानकारी भरें, ड्राफ्ट सेव करें और तैयार होने पर समीक्षा के लिए भेजें।'}</Text>\n              </View>\n              <View style={styles.createProfileButton}>\n                <Text style={styles.createProfileButtonText}>{resumableProfile ? 'जारी रखें' : 'बनाएँ'}</Text>",
          )

          # Add draft deletion API on mobile.
          replace(
              'apps/mobile/src/services/matrimony-api.ts',
              "    submitMatrimonyProfile: builder.mutation<OwnerMatrimonyProfileResponse, string>({",
              "    deleteMatrimonyProfile: builder.mutation<void, string>({\n      query: (id) => ({\n        url: `/matrimony/${id}`,\n        method: 'DELETE',\n      }),\n      invalidatesTags: (_result, _error, id) => [\n        { type: 'Matrimony', id },\n        { type: 'Matrimony', id: 'MINE' },\n        { type: 'Matrimony', id: 'LIST' },\n      ],\n    }),\n    submitMatrimonyProfile: builder.mutation<OwnerMatrimonyProfileResponse, string>({",
          )
          replace(
              'apps/mobile/src/services/matrimony-api.ts',
              "  useUpdateMatrimonyProfileMutation,\n  useSubmitMatrimonyProfileMutation,",
              "  useUpdateMatrimonyProfileMutation,\n  useDeleteMatrimonyProfileMutation,\n  useSubmitMatrimonyProfileMutation,",
          )

          # My Matrimony: explicit + means new profile, and editable drafts can be deleted.
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "  useGetMyMatrimonyProfilesQuery,\n  useSubmitMatrimonyProfileMutation,",
              "  useDeleteMatrimonyProfileMutation,\n  useGetMyMatrimonyProfilesQuery,\n  useSubmitMatrimonyProfileMutation,",
          )
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "  onSubmit,\n}: {\n  profile: MatrimonyOwnerProfile;\n  submitting: boolean;\n  onSubmit: (id: string) => void;\n}) {",
              "  onSubmit,\n  deleting,\n  onDelete,\n}: {\n  profile: MatrimonyOwnerProfile;\n  submitting: boolean;\n  onSubmit: (id: string) => void;\n  deleting: boolean;\n  onDelete: (id: string) => void;\n}) {",
          )
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "      </View>\n    </View>\n  );\n}\n\nexport default function MyMatrimonyScreen() {",
              "      </View>\n\n      {editable ? (\n        <Pressable\n          disabled={deleting}\n          style={[styles.deleteDraftButton, deleting && styles.buttonDisabled]}\n          onPress={() => onDelete(profile.id)}>\n          {deleting ? <ActivityIndicator color={C.red} size=\"small\" /> : (\n            <>\n              <SymbolView name={{ ios: 'trash', android: 'delete_outline', web: 'delete_outline' }} tintColor={C.red} size={15} />\n              <Text style={styles.deleteDraftText}>यह ड्राफ्ट हटाएँ</Text>\n            </>\n          )}\n        </Pressable>\n      ) : null}\n    </View>\n  );\n}\n\nexport default function MyMatrimonyScreen() {",
          )
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "  const [submittingId, setSubmittingId] = useState<string | null>(null);",
              "  const [submittingId, setSubmittingId] = useState<string | null>(null);\n  const [deletingId, setDeletingId] = useState<string | null>(null);",
          )
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "  const [submitProfile] = useSubmitMatrimonyProfileMutation();\n\n  async function handleSubmit(id: string) {",
              "  const [submitProfile] = useSubmitMatrimonyProfileMutation();\n  const [deleteProfile] = useDeleteMatrimonyProfileMutation();\n\n  function handleDelete(id: string) {\n    Alert.alert('ड्राफ्ट हटाएँ?', 'यह अधूरा मैट्रिमोनी ड्राफ्ट आपकी सूची से हट जाएगा।', [\n      { text: 'रहने दें', style: 'cancel' },\n      {\n        text: 'हटाएँ',\n        style: 'destructive',\n        onPress: async () => {\n          try {\n            setDeletingId(id);\n            await deleteProfile(id).unwrap();\n          } catch {\n            Alert.alert('ड्राफ्ट नहीं हटा', 'कृपया दोबारा कोशिश करें।');\n          } finally {\n            setDeletingId(null);\n          }\n        },\n      },\n    ]);\n  }\n\n  async function handleSubmit(id: string) {",
          )
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "          <Pressable style={styles.addButton} onPress={() => router.push('/matrimony-form')}>",
              "          <Pressable style={styles.addButton} onPress={() => router.push({ pathname: '/matrimony-form', params: { newProfile: '1' } })}>",
          )
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "            <Pressable style={styles.createButton} onPress={() => router.push('/matrimony-form')}>",
              "            <Pressable style={styles.createButton} onPress={() => router.push({ pathname: '/matrimony-form', params: { newProfile: '1' } })}>",
          )
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "                submitting={submittingId === profile.id}\n                onSubmit={handleSubmit}\n              />",
              "                submitting={submittingId === profile.id}\n                onSubmit={handleSubmit}\n                deleting={deletingId === profile.id}\n                onDelete={handleDelete}\n              />",
          )
          replace(
              'apps/mobile/src/app/my-matrimony.tsx',
              "  primaryButtonText: { color: '#FFFFFF', fontSize: 10.5, fontWeight: '900' },\n  buttonDisabled: { opacity: 0.62 },",
              "  primaryButtonText: { color: '#FFFFFF', fontSize: 10.5, fontWeight: '900' },\n  deleteDraftButton: { alignSelf: 'flex-start', marginTop: 10, minHeight: 34, paddingHorizontal: 10, borderRadius: 10, borderWidth: 1, borderColor: '#F0C8C2', backgroundColor: '#FFF7F5', flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 5 },\n  deleteDraftText: { color: C.red, fontSize: 9.5, fontWeight: '900' },\n  buttonDisabled: { opacity: 0.62 },",
          )

          # Backend: reuse an existing editable profile for the same person and allow draft deletion.
          replace(
              'apps/api/src/modules/matrimony/routes.ts',
              "    const profile = await prisma.matrimonyProfile.create({\n      data: {\n        createdById: userId,\n        ...parsed.data,\n        status: 'DRAFT',\n      },\n      select: ownerMatrimonyProfileSelect,\n    });\n\n    return reply.code(201).send({ profile });",
              "    const existingEditable = await prisma.matrimonyProfile.findFirst({\n      where: {\n        createdById: userId,\n        deletedAt: null,\n        status: { in: ['DRAFT', 'REJECTED'] },\n        profileFor: parsed.data.profileFor,\n        firstName: { equals: parsed.data.firstName, mode: 'insensitive' },\n        lastName: { equals: parsed.data.lastName, mode: 'insensitive' },\n        dateOfBirth: parsed.data.dateOfBirth,\n      },\n      select: ownerMatrimonyProfileSelect,\n      orderBy: { createdAt: 'desc' },\n    });\n\n    if (existingEditable) {\n      return reply.send({ profile: existingEditable, reused: true });\n    }\n\n    const profile = await prisma.matrimonyProfile.create({\n      data: {\n        createdById: userId,\n        ...parsed.data,\n        status: 'DRAFT',\n      },\n      select: ownerMatrimonyProfileSelect,\n    });\n\n    return reply.code(201).send({ profile });",
          )
          replace(
              'apps/api/src/modules/matrimony/routes.ts',
              "  app.post('/:id/submit', async (request, reply) => {",
              "  app.delete('/:id', async (request, reply) => {\n    const userId = await getActiveUserId(request, reply);\n    if (!userId) return;\n\n    const { id } = request.params as { id: string };\n    const existing = await prisma.matrimonyProfile.findFirst({\n      where: { id, createdById: userId, deletedAt: null },\n      select: { id: true, status: true },\n    });\n\n    if (!existing) return reply.code(404).send({ error: 'MATRIMONY_PROFILE_NOT_FOUND' });\n    if (!['DRAFT', 'REJECTED'].includes(existing.status)) {\n      return reply.code(409).send({ error: 'MATRIMONY_PROFILE_NOT_DELETABLE', status: existing.status });\n    }\n\n    await prisma.matrimonyProfile.update({\n      where: { id },\n      data: { deletedAt: new Date() },\n    });\n\n    return reply.code(204).send();\n  });\n\n  app.post('/:id/submit', async (request, reply) => {",
          )
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @damodar/api build
      - run: pnpm --filter mobile exec tsc --noEmit

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-matrimony-drafts-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(matrimony): resume drafts and stabilize media uploads"
          git push origin HEAD:main
