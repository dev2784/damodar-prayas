name: Finish matrimony interaction UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finish-matrimony-interactions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch screens
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          def d(value): return base64.b64decode(value).decode()
          def rep(text, old64, new64, label):
              old, new = d(old64), d(new64)
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)
          p = Path('apps/mobile/src/app/matrimony-profile.tsx')
          s = p.read_text()
          s = rep(s, 'aW1wb3J0IHsgQWN0aXZpdHlJbmRpY2F0b3IsIFByZXNzYWJsZSwgU2Nyb2xsVmlldywgU3R5bGVTaGVldCwgVGV4dCwgVmlldyB9IGZyb20gJ3JlYWN0LW5hdGl2ZSc7', 'aW1wb3J0IHsgQWN0aXZpdHlJbmRpY2F0b3IsIEFsZXJ0LCBNb2RhbCwgUHJlc3NhYmxlLCBTY3JvbGxWaWV3LCBTdHlsZVNoZWV0LCBUZXh0LCBWaWV3IH0gZnJvbSAncmVhY3QtbmF0aXZlJzsKaW1wb3J0IHsgdXNlU3RhdGUgfSBmcm9tICdyZWFjdCc7', 'profile import')
          s = rep(s, 'aW1wb3J0IHsgdHlwZSBNYXRyaW1vbnlQcm9maWxlLCB1c2VHZXRNYXRyaW1vbnlQcm9maWxlUXVlcnkgfSBmcm9tICdAL3NlcnZpY2VzL21hdHJpbW9ueS1hcGknOw==', '', 'api import')
          s = rep(s, 'ZnVuY3Rpb24gUHJvZmlsZURldGFpbHMoeyBwcm9maWxlIH06IHsgcHJvZmlsZTogTWF0cmltb255UHJvZmlsZSB9KSB7CiAgY29uc3QgcGhvdG8=', '', 'profile details')
          s = rep(s, '', '', 'actions')
          s = rep(s, 'ICBhY3Rpb25zQ2FyZDogeyBmbGV4RGlyZWN0aW9uOiAncm93JywgZ2FwOiA5LCBtYXJnaW5Ub3A6IDExIH0s', '', 'styles')
          p.write_text(s)
          p = Path('apps/mobile/src/app/my-matrimony.tsx')
          s = p.read_text()
          s = rep(s, '', '', 'my links')
          s = rep(s, 'Y29uc3Qgc3R5bGVzID0gU3R5bGVTaGVldC5jcmVhdGUoewo=', '', 'my styles')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter mobile exec tsc --noEmit
          pnpm --filter @damodar/api build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finish-matrimony-interactions.yml .github/workflows/add-matrimony-interactions.yml
          git add apps/mobile/src/app/matrimony-profile.tsx apps/mobile/src/app/my-matrimony.tsx
          git commit -m "feat(matrimony): wire shortlist and interest interactions"
          git push origin main
